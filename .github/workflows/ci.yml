name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  # write: the android job publishes the APK as a release asset.
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  mobile:
    name: Mobile JS
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm ci

      # arm64-v8a only: phones use it, and it keeps the C++ build short.
      # The release build type is signed with the repo's debug keystore, so no
      # repository secrets are needed to produce an installable APK.
      - name: Build Android release APK
        working-directory: mobile/android
        env:
          NODE_ENV: production
        run: |
          bash ./gradlew :app:createBundleReleaseJsAndAssets :app:assembleRelease \
            -PreactNativeArchitectures=arm64-v8a --no-daemon --console=plain --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: codex-mobile-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # A release asset is a direct .apk download, so installing no longer means
      # downloading a zip and extracting it on the phone.
      - name: Publish APK release
        working-directory: mobile/android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          tag="v${version}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "Codex Mobile ${version}" \
              --notes "APK built from ${GITHUB_SHA::7} (arm64-v8a, debug-signed)."
          gh release upload "$tag" app/build/outputs/apk/release/*.apk --clobber
